const sectionSelect = document.getElementById('sectionSelect');
for(let i = 0; i < 100; i++) {
    const option = document.createElement('option');
    option.value = i;
    option.text = `القسم ${i+1} - ${allSections[i].length} سؤال`;
    sectionSelect.appendChild(option);
}

let currentSection = 0;
let currentQ = 0;
let userAnswers = [];

function changeSection() {
    currentSection = parseInt(document.getElementById('sectionSelect').value);
    document.getElementById('sectionNum').innerText = `القسم ${currentSection+1} من 100`;
}

function startSection() {
    if(allSections[currentSection].length === 0) {
        alert('هذا القسم فاضي. أضف أسئلة أولاً');
        return;
    }
    currentQ = 0;
    // التعديل 1: يصنع مصفوفة بنفس عدد الأسئلة الحقيقي
    userAnswers = Array(allSections[currentSection].length).fill(null).map(() => []);
    document.querySelector('.section-select').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    loadQ();
}

function loadQ() {
    const q = allSections[currentSection][currentQ];
    const totalQ = allSections[currentSection].length;

    document.getElementById('sectionNum').innerText = `القسم ${currentSection+1} من 100`;
    // التعديل 2: يطبع العدد الحقيقي بدل 100
    document.getElementById('qNum').innerText = `سؤال ${currentQ+1} من ${totalQ}`;
    // التعديل 3: شريط التقدم ديناميكي
    document.getElementById('progress').style.width = `${((currentQ+1)/totalQ)*100}%`;
    document.getElementById('question').innerText = `${currentQ+1}. ${q.q}`;

    let optsHtml = '';
    q.options.forEach((opt, i) => {
        const checked = userAnswers[currentQ].includes(i)? 'checked' : '';
        optsHtml += `<label><input type="checkbox" value="${i}" ${checked} onchange="saveAnswer(${i})"> ${String.fromCharCode(65+i)}. ${opt}</label>`;
    });
    document.getElementById('options').innerHTML = optsHtml;
    document.getElementById('prevBtn').disabled = currentQ === 0;

    // التعديل 4: يخفي "التالي" في آخر سؤال ويظهر "إنهاء"
    document.getElementById('nextBtn').style.display = currentQ === totalQ - 1? 'none' : 'inline-block';
    document.getElementById('submitBtn').style.display = currentQ === totalQ - 1? 'inline-block' : 'none';

    // التعديل 5: يحدث max حق خانة القفز
    document.getElementById('jumpTo').max = totalQ;
}

function saveAnswer(idx) {
    const arr = userAnswers[currentQ];
    const pos = arr.indexOf(idx);
    if (pos > -1) arr.splice(pos, 1); else arr.push(idx);
}

// التعديل 6: يشيك العدد الحقيقي بدل 99
function nextQ() {
    if (currentQ < allSections[currentSection].length - 1) {
        currentQ++;
        loadQ();
    } else {
        submitQuiz();
    }
}

function prevQ() { if (currentQ > 0) { currentQ--; loadQ(); } }

function jumpQ() {
    const num = parseInt(document.getElementById('jumpTo').value);
    const totalQ = allSections[currentSection].length;
    if (num >= 1 && num <= totalQ) {
        currentQ = num - 1;
        loadQ();
        document.getElementById('jumpTo').value = '';
    }
}

function submitQuiz() {
    let score = 0;
    const totalQ = allSections[currentSection].length;

    allSections[currentSection].forEach((q, i) => {
        const correct = q.answer.sort().join(',');
        const user = (userAnswers[i] || []).sort().join(',');
        if (correct === user) score++;
    });

    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('resultTitle').innerText = `نتيجة القسم ${currentSection+1}`;
    // التعديل 7: النتيجة من العدد الحقيقي
    document.getElementById('score').innerText = `${score} / ${totalQ}`;
    document.getElementById('percent').innerText = `النسبة: ${((score/totalQ)*100).toFixed(1)}%`;
}

function reviewAnswers() {
    let html = '';
    allSections[currentSection].forEach((q, i) => {
        const correct = q.answer.sort().join(',');
        const user = (userAnswers[i] || []).sort().join(',');
        const isCorrect = correct === user;
        html += `<div class="review-item ${isCorrect? 'correct' : 'wrong'}">
            <strong>س${i+1}: ${q.q}</strong><br>
            إجابتك: ${userAnswers[i].map(x => String.fromCharCode(65+x) + '. ' + q.options[x]).join(' | ') || 'لم تجب'}<br>
            الصحيحة: ${q.answer.map(x => String.fromCharCode(65+x) + '. ' + q.options[x]).join(' | ')}
        </div>`;
    });
    document.getElementById('review').innerHTML = html;
}

function backToSections() {
    document.getElementById('result').style.display = 'none';
    document.querySelector('.section-select').style.display = 'block';
    document.getElementById('review').innerHTML = '';
    sectionSelect.options[currentSection].text = `القسم ${currentSection+1} - ${allSections[currentSection].length} سؤال`;
}

changeSection();
