<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التمريض Pro V2</title>
<meta name="theme-color" content="#3498db">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22اختبار%20التمريض%20Pro%22,%22short_name%22:%22تمريض%20Pro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f5f7fa%22,%22theme_color%22:%22%233498db%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E💉%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">
<style>
:root {--primary:#3498db; --success:#27ae60; --danger:#e74c3c; --warning:#f39c12; --bg:#f5f7fa; --card:#ffffff; --text:#2c3e50; --border:#e9ecef;}
[data-theme="dark"] {--bg:#1a1a1a; --card:#2d2d2d; --text:#ecf0f1; --border:#444;}
[data-theme="green"] {--primary:#27ae60;}
[data-theme="purple"] {--primary:#9b59b6;}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);margin:0;padding:20px;color:var(--text);transition:all .3s}
.container{max-width:1000px;margin:auto;background:var(--card);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);overflow:hidden}
.header{background:var(--primary);color:white;padding:20px;text-align:center;position:relative}
.header h1{margin:0;font-size:24px}
.progress{background:var(--border);height:8px}
.progress-bar{background:var(--success);height:100%;width:0%;transition:width .3s}
.quiz-area{padding:25px}
.question{font-size:18px;font-weight:bold;margin-bottom:20px;line-height:1.6}
.options label{display:block;background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:12px 15px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.options label:hover{background:var(--primary);color:white;border-color:var(--primary)}
.options label.selected{background:var(--primary);color:white;border-color:var(--primary)}
.options label.correct-answer{background:var(--success)!important;color:white!important;border-color:var(--success)!important}
.options label.wrong-answer{background:var(--danger)!important;color:white!important;border-color:var(--danger)!important}
.options input{margin-left:10px;transform:scale(1.2)}
.btn{background:var(--primary);color:white;border:none;padding:12px 25px;border-radius:6px;font-size:16px;cursor:pointer;margin:10px 5px;transition:background .2s}
.btn:hover{opacity:.9}
.btn:disabled{background:#bdc3c7;cursor:not-allowed}
.btn-green{background:var(--success)}
.btn-orange{background:var(--warning)}
.btn-red{background:var(--danger)}
.check-q-btn{background:var(--warning);color:white;border:none;padding:8px 15px;border-radius:6px;font-size:14px;cursor:pointer;margin-top:10px}
.check-q-btn:disabled{background:#95a5a6;cursor:not-allowed}
.result{text-align:center;padding:30px;display:none}
.result h2{color:var(--success);font-size:28px}
.score{font-size:48px;font-weight:bold;color:var(--primary);margin:20px 0}
.review{text-align:right;margin-top:20px;max-height:400px;overflow-y:auto}
.review-item{background:var(--bg);padding:15px;border-radius:8px;margin-bottom:10px;border-right:4px solid}
.correct{border-color:var(--success)}
.wrong{border-color:var(--danger)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
#qNum,#sectionNum{color:var(--text);font-weight:bold;opacity:.7}
.section-select{padding:20px;text-align:center}
.section-select select,.section-select label{padding:8px 15px;font-size:16px;border-radius:6px;margin:5px;background:var(--bg);color:var(--text);border:1px solid var(--border)}
.batch-info{background:var(--primary);color:white;padding:12px;text-align:center;font-weight:bold;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.mini-result{background:var(--bg);border:2px solid var(--warning);padding:25px;border-radius:8px;margin:20px 0;text-align:center;display:none}
.mini-result h3{color:var(--warning);margin:0 0 15px 0;font-size:22px}
.note{font-size:14px;color:var(--warning);margin:8px 0;font-weight:bold;background:var(--bg);padding:5px;border-radius:4px}
.timer{background:var(--danger);color:white;padding:5px 12px;border-radius:20px;font-size:14px}
.top-nav{position:absolute;top:10px;left:10px;display:flex;gap:5px}
.top-nav-right{position:absolute;top:10px;right:10px;display:flex;gap:5px}
.icon-btn{background:rgba(255,255,0.2);border:none;color:white;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.icon-btn:hover{background:rgba(255,255,0.3)}
.checkbox-container{margin:15px 0;text-align:center}
.checkbox-container label{cursor:pointer;font-size:16px}
.checkbox-container input{transform:scale(1.3);margin-left:8px}
.dashboard{display:none;padding:25px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:20px 0}
.stat-card{background:var(--bg);padding:20px;border-radius:8px;text-align:center;border:1px solid var(--border)}
.stat-card h3{margin:0 0 10px 0;font-size:16px;opacity:.7}
.stat-card .value{font-size:32px;font-weight:bold;color:var(--primary)}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;justify-content:center}
.badge{background:var(--bg);border:2px solid var(--border);padding:10px 15px;border-radius:20px;font-size:14px}
.badge.earned{background:var(--success);color:white;border-color:var(--success)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-content{background:var(--card);padding:30px;border-radius:12px;max-width:500px;width:90%;text-align:center}
.mock-setup{background:var(--bg);padding:20px;border-radius:8px;margin:20px 0}
.mock-setup input{width:80px;padding:8px;margin:0 10px;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px}
.clinical-case{background:#e3f2fd;border-right:4px solid var(--primary);padding:12px;margin-bottom:15px;border-radius:6px;font-style:italic}
[data-theme="dark"] .clinical-case{background:#1e3a5f}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="top-nav">
            <button class="icon-btn" id="backBtn" onclick="backToSectionsConfirm()" style="display:none" title="رجوع">←</button>
            <button class="icon-btn" onclick="showDashboard()" title="الإحصائيات">📊</button>
        </div>
        <div class="top-nav-right">
            <button class="icon-btn" onclick="toggleTheme()" title="الوضع الليلي">🌙</button>
            <button class="icon-btn" onclick="changeColor()" title="تغيير اللون">🎨</button>
        </div>
        <h1>اختبار التمريض Pro V2</h1>
        <div id="sectionNum">اختر القسم للبدء</div>
        <div id="qNum">-</div>
    </div>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="section-select" id="sectionSelectArea">
        <label>اختر القسم: </label>
        <select id="sectionSelect"></select><br>
        <div class="checkbox-container">
            <label><input type="checkbox" id="shuffleCheck"> خلط الأسئلة والخيارات</label>
        </div>
        <button class="btn btn-green" onclick="startQuiz()">ابدأ الاختبار</button>
        <button class="btn btn-orange" id="continueBtn" onclick="continueQuiz()" style="display:none">كمل من آخر مكان</button>
        <button class="btn" onclick="showMockSetup()">اختبار تجريبي</button>
    </div>
    <div class="dashboard" id="dashboard">
        <h2>لوحة الإنجازات</h2>
        <div class="stats-grid">
            <div class="stat-card"><h3>المعدل العام</h3><div class="value" id="avgScore">0%</div></div>
            <div class="stat-card"><h3>الأقسام المكتملة</h3><div class="value" id="completedSections">0</div></div>
            <div class="stat-card"><h3>أفضل قسم</h3><div class="value" id="bestSection">-</div></div>
            <div class="stat-card"><h3>سلسلة الأيام 🔥</h3><div class="value" id="streakDays">0</div></div>
        </div>
        <h3>الشارات</h3>
        <div class="badges" id="badgesContainer"></div>
        <button class="btn" onclick="hideDashboard()">رجوع</button>
    </div>
    <div class="quiz-area" id="quizArea" style="display:none">
        <div class="batch-info">
            <span id="batchInfoText"></span>
            <span class="timer" id="batchTimer">00:00</span>
        </div>
        <div class="mini-result" id="miniResult">
            <h3>نتيجة الدفعة الحالية</h3>
            <div class="score" id="miniScore"></div>
            <div id="miniPercent" style="font-size:18px;margin:10px 0"></div>
            <div id="miniTime" style="margin:10px 0;color:var(--text)"></div>
            <button class="btn btn-green" id="continueBatchBtn" onclick="continueBatch()">كمل الدفعة الجاية</button>
            <button class="btn" onclick="submitQuiz()">إنهاء واشوف النتيجة النهائية</button>
        </div>
        <div id="questionArea">
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div class="nav">
                <button class="btn" id="prevBtn" onclick="prevQ()">السابق</button>
                <button class="btn" id="nextBtn" onclick="nextQ()">التالي</button>
                <button class="btn btn-green" id="checkBatchBtn" onclick="checkBatch()" style="display:none">تحقق من الإجابات</button>
            </div>
        </div>
    <div class="result" id="result">
        <h2 id="resultTitle">نتيجة القسم</h2>
        <div class="score" id="score"></div>
        <div id="percent"></div>
        <div id="totalTime" style="margin:15px 0;font-size:18px;color:var(--text)"></div>
        <div id="badgeEarned" style="margin:15px 0;font-size:20px;color:var(--success)"></div>
        <button class="btn btn-orange" id="reviewWrongBtn" onclick="startWrongOnly()" style="display:none">اختبرني في الأخطاء فقط</button>
        <button class="btn" onclick="reviewAnswers()">مراجعة كل الإجابات</button>
        <button class="btn btn-red" onclick="backToSectionsConfirm()">رجوع لاختيار قسم</button>
        <div class="review" id="review"></div>
    </div>
</div>
<div class="modal" id="mockModal">
    <div class="modal-content">
        <h2>الاختبار التجريبي</h2>
        <div class="mock-setup">
            <label>عدد الأسئلة: <input type="number" id="mockCount" value="50" min="10" max="1000"></label><br><br>
            <label>الوقت بالدقائق: <input type="number" id="mockTime" value="60" min="10" max="180"></label>
        </div>
        <button class="btn btn-green" onclick="startMockExam()">ابدأ الاختبار</button>
        <button class="btn" onclick="closeMockModal()">إلغاء</button>
    </div>
</div>
<script>
const BATCH_SIZE = 10;
const allSections = [
[ // 100-1 الأسئلة :1 القسم
{"q":"أي من التالي يعتبر من العلامات الحيوية الأساسية؟","options":["النبض","ضغط الدم","درجة الحرارة","لون البشرة"],"answer":[0,1,2]},
{"q":"عند إعطاء حقنة عضلية للبالغ في عضلة الألوية، أي مما يلي صحيح؟","options":["استخدام إبرة 21-23G","الزاوية 90 درجة","سحب المكبس للتأكد من عدم وجود دم","أقصى حجم 5 مل"],"answer":[0,1,2,3]},
{"q":"أي من التالي من مضاعفات التغذية الوريدية الكاملة TPN؟","options":["عدوى","ارتفاع سكر الدم","اختلال الكهارل","انخفاض الضغط"],"answer":[0,1,2]},
{"q":"مريض لديه قسطرة وريدية مركزية، أي من العلامات تدل على عدوى موضع القسطرة؟","options":["احمرار","تورم","خروج قيح","انخفاض حرارة"],"answer":[0,1,2]},
{"q":"عند التعامل مع مريض لديه أنبوب صدري، أي مما يلي صحيح؟","options":["إبقاء زجاجة التجميع تحت مستوى الصدر","التأكد من وجود تموج مع التنفس","تثبيت الأنبوب","كلامب الأنبوب عند نقل المريض روتينياً"],"answer":[0,1,2]},
{"q":"أي من التالي من علامات نقص بوتاسيوم الدم؟","options":["موجة U في تخطيط القلب","ضعف عضلي","إمساك","ارتفاع ضغط"],"answer":[0,1,2]},
{"q":"عند إعطاء دواء Warfarin، أي من التالي يجب مراقبته؟","options":["INR","علامات النزيف","PT","مستوى الهيموجلوبين فقط"],"answer":[0,1,2]},
{"q":"مريض يعاني من فشل كلوي حاد، أي من التالي من مؤشرات غسيل الكلى الطارئ؟","options":["فرط بوتاسيوم >6.5","وذمة رئوية","حماض استقلابي شديد","ارتفاع الكرياتينين فقط"],"answer":[0,1,2]},
{"q":"أي من التالي صحيح بخصوص العزل التلامسي؟","options":["ارتداء قفاز ومريول","غرفة خاصة","نقل المريض محدود","كمامة N95"],"answer":[0,1,2]},
{"q":"عند تقييم الألم، أي من التالي من مقاييس الألم؟","options":["المقياس الرقمي","مقياس الوجوه","FLACC للأطفال","مقياس كولورادو"],"answer":[0,1,2]},
{"q":"مريض لديه جلطة دماغية، أي من التالي من علامات الإنذار FAST؟","options":["تدلي الوجه","ضعف الذراع","صعوبة الكلام","صداع فقط"],"answer":[0,1,2]},
{"q":"أي من التالي من علامات الصدمة التأقية Anaphylaxis؟","options":["شرى","وذمة وعائية","ضيق تنفس","ارتفاع ضغط"],"answer":[0,1,2]},
{"q":"عند إعطاء Insulin، أي من التالي صحيح؟","options":["حقن سريع تحت الجلد","تدوير مواقع الحقن","عدم رج العبوة","يمكن خلط NPH مع Regular"],"answer":[1,2,3]},
{"q":"مريض لديه قرحة فراش Stage 2، أي من التالي صحيح؟","options":["فقدان جزئي للجلد","ظهور فقاعة","قاع أحمر","وصول للعضلة"],"answer":[0,1,2]},
{"q":"أي من التالي من موانع استخدام المورفين؟","options":["فشل تنفسي حاد","انخفاض ضغط شديد","حساسية","ألم متوسط"],"answer":[0,1,2]},
{"q":"عند التعامل مع مريض لديه CVP مرتفع، هذا يدل على:","options":["فرط حجم","فشل قلبي أيمن","انسداد تامور","نقص حجم"],"answer":[0,1,2]},
{"q":"أي من التالي صحيح بخصوص اختبار Mantoux للسل؟","options":["يقرأ بعد 48-72 ساعة","تفاعل ≥10 مم إيجابي لمعظم الناس","لا يتأثر بلقاح BCG أبداً","يقيس التعرض السابق"],"answer":[0,1,3]},
{"q":"مريض لديه نزيف هضمي علوي، أي من التالي من العلامات؟","options":["قيء دموي","براز أسود","انخفاض ضغط","يرقان"],"answer":[0,1,2]},
{"q":"أي من التالي من أهداف الإنعاش القلبي الرئوي؟","options":["إعادة الدورة الدموية","الحفاظ على التروية الدماغية","إعادة الوعي فوراً","منع توقف القلب"],"answer":[0,1]},
{"q":"عند إعطاء Furosemide، أي من التالي يجب مراقبته؟","options":["بوتاسيوم","ضغط الدم","وزن المريض","السمع"],"answer":[0,1,2,3]},
{"q":"مريض لديه فشل تنفسي، أي من التالي من علامات التعب؟","options":["استخدام عضلات ملحقة","تسرع تنفس","تنفس متناقض","بطء نبض"],"answer":[0,1,2]},
{"q":"أي من التالي من طرق منع عدوى المسالك المرتبطة بالقسطرة؟","options":["تركيب بتعقيم","إبقاء الكيس تحت مستوى المثانة","إزالة القسطرة بأسرع وقت","غسل المثانة روتينياً"],"answer":[0,1,2]},
{"q":"عند تقييم مريض السكري، فحص HbA1c يدل على:","options":["متوسط السكر 3 شهور","لا يحتاج صيام","الهدف <7% لمعظم البالغين","يقيس سكر اليوم"],"answer":[0,1,2]},
{"q":"أي من التالي صحيح بخصوص نقل الدم؟","options":["مطابقة فصيلة ABO","بدء ببطء أول 15 دقيقة","قياس العلامات الحيوية","يمكن إعطاؤه مع D5W"],"answer":[0,1,2]},
{"q":"مريض لديه حروق، أي من التالي من قاعدة التسعات للبالغ؟","options":["الرأس 9%","ذراع واحدة 9%","الجذع الأمامي 18%","رجل واحدة 9%"],"answer":[0,1,2]},
{"q":"أي من التالي من علامات فرط نشاط الغدة الدرقية؟","options":["تسرع قلب","فقدان وزن","عدم تحمل حرارة","إمساك"],"answer":[0,1,2]},
{"q":"عند التعامل مع مريض لديه صرع، أثناء النوبة يجب:","options":["حماية رأسه","وضع شيء بالفم","فك الملابس الضيقة","تقييد حركته"],"answer":[0,2]},
{"q":"أي من التالي من مضاعفات استخدام القسطرة الوريدية المحيطية؟","options":["التهاب وريد","ارتشاح","عدوى","جلطة"],"answer":[0,1,2,3]},
{"q":"مريض لديه COPD، أي من التالي من التثقيف؟","options":["تمارين تنفس بزم الشفاه","تجنب المهيجات","أخذ لقاح الإنفلونزا","استخدام أكسجين عالي التدفق دائماً"],"answer":[0,1,2]},
{"q":"أي من التالي صحيح بخصوص اختبار وظائف الرئة؟","options":["FEV1/FVC <70% يدل على انسداد","TLC يرتفع في الانتفاخ","DLCO ينخفض في التليف","لا يحتاج مجهود من المريض"],"answer":[0,1,2]},
{"q":"عند إعطاء Heparin، أي من التالي نراقبه؟","options":["aPTT","صفائح دموية","علامات نزيف","PT فقط"],"answer":[0,1,2]},
{"q":"مريض لديه فشل قلبي، أي من التالي من علامات الجهة اليسرى؟","options":["ضيق نفس","وذمة رئة","سعال ليلي","وذمة كاحل"],"answer":[0,1,2]},
{"q":"أي من التالي من علامات نقص كالسيوم الدم؟","options":["علامة تروسو","علامة شفوستك","تشنجات","ارتفاع ضغط"],"answer":[0,1,2]},
{"q":"عند التعامل مع مريض لديه جلطة رئوية، أي من التالي من العلاج؟","options":["هيبارين","أكسجين","مدرات","مضاد حيوي"],"answer":[0,1]},
{"q":"أي من التالي صحيح بخصوص تطعيم الإنفلونزا؟","options":["يعطى سنوياً","آمن للحامل","يسبب إنفلونزا","يقي 100%"],"answer":[0,1]},
{"q":"مريض لديه فشل كبدي، أي من التالي من علامات الاعتلال الدماغي؟","options":["Asterixis","تشوش","تغير شخصية","إسهال"],"answer":[0,1,2]},
{"q":"أي من التالي من موانع استخدام Beta Blocker؟","options":["ربو","بطء قلب شديد","فشل قلبي غير معوض","ارتفاع ضغط"],"answer":[0,1,2]},
{"q":"عند تقييم مريض الصدمة، أي من التالي من أولويات ABCDE؟","options":["مجرى هواء","تنفس","دورة دموية","فحص عصبي"],"answer":[0,1,2,3]},
{"q":"أي من التالي صحيح بخصوص العناية بالفغر Stoma؟","options":["قياس حجم الفغر دورياً","حماية الجلد حوله","تفريغ الكيس عندما يمتلئ 1/3","تجنب الألياف دائماً"],"answer":[0,1,2]},
{"q":"مريض لديه فقر دم، أي من التالي من الأعراض؟","options":["تعب","شحوب","تسرع قلب","يرقان"],"answer":[0,1,2]},

for(let i = 0; i < allSections.length; i++) {

let currentSection = 0, currentQ = 0, userAnswers = [], currentBatchStart = 0;
let batchStartTime = 0, totalStartTime = 0, timerInterval = null, mockTimer = null;
let wrongQuestions = [], isReviewMode = false, originalQuestions = [], isMockMode = false;

function initTheme() {
    const theme = localStorage.getItem('theme') || 'light';
    const color = localStorage.getItem('color') || 'blue';
    document.body.setAttribute('data-theme', theme);
    if(color!== 'blue') document.body.setAttribute('data-theme', color);
    document.querySelector('.icon-btn[title="الوضع الليلي"]').innerText = theme === 'dark'? '☀️' : '🌙';
}

function toggleTheme() {
    const current = document.body.getAttribute('data-theme');
    const newTheme = current === 'dark'? 'light' : 'dark';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.querySelector('.icon-btn[title="الوضع الليلي"]').innerText = newTheme === 'dark'? '☀️' : '🌙';
}

function changeColor() {
    const colors = ['blue', 'green', 'purple'];
    const current = localStorage.getItem('color') || 'blue';
    const next = colors[(colors.indexOf(current) + 1) % colors.length];
    document.body.setAttribute('data-theme', next);
    localStorage.setItem('color', next);
}

function playSound(type) {
    if(navigator.vibrate) {
        if(type === 'correct') navigator.vibrate(50);
        else if(type === 'wrong') navigator.vibrate([100,50,100]);
    }
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = type === 'correct'? 800 : 300;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}

function updateStats(score, total) {
    const stats = JSON.parse(localStorage.getItem('stats') || '{"sections":{},"streak":0,"lastDate":""}');
    stats.sections[currentSection] = {score: score, total: total, date: Date.now()};
    const today = new Date().toDateString();
    if(stats.lastDate!== today) {
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        stats.streak = stats.lastDate === yesterday? stats.streak + 1 : 1;
        stats.lastDate = today;
    }
    localStorage.setItem('stats', JSON.stringify(stats));
    checkBadges(score, total);
}

function checkBadges(score, total) {
    const badges = JSON.parse(localStorage.getItem('badges') || '[]');
    const percent = (score/total)*100;
    let earned = '';
    if(percent === 100 &&!badges.includes('perfect')) {
        badges.push('perfect'); earned = '🏆 Perfect Score!';
    }
    const stats = JSON.parse(localStorage.getItem('stats'));
    const completed = Object.keys(stats.sections).length;
    if(completed >= 10 &&!badges.includes('master10')) {
        badges.push('master10'); earned = '🎓 Master - 10 أقسام!';
    }
    if(stats.streak >= 7 &&!badges.includes('streak7')) {
        badges.push('streak7'); earned = '🔥 7 أيام متتالية!';
    }
    localStorage.setItem('badges', JSON.stringify(badges));
    if(earned) document.getElementById('badgeEarned').innerText = earned;
}

function showDashboard() {
    const stats = JSON.parse(localStorage.getItem('stats') || '{"sections":{},"streak":0}');
    const sections = Object.values(stats.sections);
    const avg = sections.length? (sections.reduce((s,v) => s+v.score/v.total, 0) / sections.length * 100).toFixed(1) : 0;
    let best = '-';
    if(sections.length) {
        let maxPct = 0, maxSec = 0;
        Object.entries(stats.sections).forEach(([sec, data]) => {
            const pct = data.score/data.total;
            if(pct > maxPct) { maxPct = pct; maxSec = parseInt(sec); }
        });
        best = `القسم ${maxSec+1} (${(maxPct*100).toFixed(0)}%)`;
    }
    document.getElementById('avgScore').innerText = avg + '%';
    document.getElementById('completedSections').innerText = sections.length;
    document.getElementById('bestSection').innerText = best;
    document.getElementById('streakDays').innerText = stats.streak;
    const badges = JSON.parse(localStorage.getItem('badges') || '[]');
    const allBadges = [
        {id:'perfect', name:'🏆 Perfect Score'},
        {id:'master10', name:'🎓 Master 10'},
        {id:'streak7', name:'🔥 أسبوع كامل'}
    ];
    document.getElementById('badgesContainer').innerHTML = allBadges.map(b =>
        `<div class="badge ${badges.includes(b.id)?'earned':''}">${b.name}</div>`
    ).join('');
    document.getElementById('sectionSelectArea').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
}

function hideDashboard() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('sectionSelectArea').style.display = 'block';
}

function showMockSetup() {

}

function closeMockModal() {

}

        navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))))');
    }

function checkSavedProgress() {
    for(let i = 0; i < allSections.length; i++) {
        if(localStorage.getItem('quiz_'+i)) {
            document.getElementById('continueBtn').style.display = 'inline-block';
            break;
        }
    }
}
function startMockExam() {
    const count = parseInt(document.getElementById('mockCount').value);
    const time = parseInt(document.getElementById('mockTime').value);
    let allQs = [];
    allSections.forEach((sec, secIdx) => {
        sec.forEach((q, qIdx) => allQs.push({...q, section: secIdx, originalIdx: qIdx}));
    });
    if(allQs.length === 0) {
        alert('لا توجد أسئلة في أي قسم');
        return;
    }
    shuffleArray(allQs);
    allSections[0] = allQs.slice(0, Math.min(count, allQs.length));
    currentSection = 0;
    isMockMode = true;
    mockTimeLeft = time * 60;
    closeMockModal();
    sectionSelect.value = 0;
    startQuiz();
    mockTimer = setInterval(() => {
        mockTimeLeft--;
        if(mockTimeLeft <= 0) {
            clearInterval(mockTimer);
            alert('انتهى الوقت!');
            submitQuiz();
        }
    }, 1000);
}

function continueQuiz() {
    for(let i = 0; i < allSections.length; i++) {
        const saved = localStorage.getItem('quiz_'+i);
        if(saved) {
            currentSection = i;
            sectionSelect.value = i;
            const data = JSON.parse(saved);
            userAnswers = data.answers;
            currentQ = data.currentQ;
            currentBatchStart = Math.floor(currentQ / BATCH_SIZE) * BATCH_SIZE;
            totalStartTime = data.totalStartTime || Date.now();
            document.getElementById('sectionSelectArea').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('quizArea').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            startBatchTimer();
            loadQ();
            return;
        }
    }
}

function startQuiz() {
    currentSection = parseInt(sectionSelect.value);
    if(allSections[currentSection].length === 0 &&!isMockMode) {
        alert('هذا القسم فاضي. أضف أسئلة أولاً');
        return;
    }
    isReviewMode = false;
    originalQuestions = JSON.parse(JSON.stringify(allSections[currentSection]));
    if(document.getElementById('shuffleCheck').checked &&!isMockMode) {
        shuffleArray(allSections[currentSection]);
        allSections[currentSection].forEach(q => {
            const correctAnswers = q.answer.map(idx => q.options[idx]);
            shuffleArray(q.options);
            q.answer = correctAnswers.map(ans => q.options.indexOf(ans));
        });
    }
    currentQ = 0;
    currentBatchStart = 0;
    userAnswers = Array(allSections[currentSection].length).fill(null).map(() => []);
    totalStartTime = Date.now();
    document.getElementById('sectionSelectArea').style.display = 'none';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('backBtn').style.display = 'block';
    startBatchTimer();
    loadQ();
}

function shuffleArray(arr) {
    for(let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function startBatchTimer() {
    batchStartTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - batchStartTime) / 1000);
    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const secs = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('batchTimer').innerText = `${mins}:${secs}`;
}
function loadQ() {
    singleChecked = false;
    const q = allSections[currentSection][currentQ];
    const totalInSection = allSections[currentSection].length;
    document.getElementById('sectionNum').innerText = `${isMockMode?'اختبار تجريبي':`القسم ${currentSection+1}`} - ${totalInSection} سؤال ${isReviewMode?'(مراجعة الأخطاء)' : ''}`;
    document.getElementById('qNum').innerText = `سؤال ${currentQ+1} من ${totalInSection}`;
    const batchNum = Math.floor(currentQ / BATCH_SIZE) + 1;
    const batchStart = currentBatchStart + 1;
    const batchEnd = Math.min(currentBatchStart + BATCH_SIZE, totalInSection);
    const batchCount = batchEnd - currentBatchStart;
    document.getElementById('batchInfoText').innerText = `الدفعة ${batchNum}: الأسئلة ${batchStart} - ${batchEnd} (${batchCount} أسئلة)`;
    document.getElementById('progress').style.width = `${((currentQ+1)/totalInSection)*100}%`;
    const isMultiple = q.answer.length > 1;
    const note = isMultiple? '<div class="note">* هذا السؤال له أكثر من إجابة صحيحة</div>' : '';
    document.getElementById('question').innerHTML = `${currentQ+1}. ${q.q} ${note}`;
    let optsHtml = '';
    const inputType = isMultiple? 'checkbox' : 'radio';
    q.options.forEach((opt, i) => {
        const checked = userAnswers[currentQ].includes(i)? 'checked' : '';
        const selectedClass = userAnswers[currentQ].includes(i)? 'selected' : '';
        optsHtml += `<label class="${selectedClass}" id="opt-${i}"><input type="${inputType}" name="q${currentQ}" value="${i}" ${checked} onchange="saveAnswer(${i})"> ${String.fromCharCode(65+i)}. ${opt}</label>`;
    });
    optsHtml += `<button class="check-q-btn" id="checkQBtn" onclick="checkSingleQuestion()" ${userAnswers[currentQ].length === 0? 'disabled' : ''}>تحقق من إجابة هذا السؤال</button>`;

    document.getElementById('options').innerHTML = optsHtml;
    document.getElementById('prevBtn').disabled = currentQ === 0;
    const isLastInBatch = (currentQ + 1) % BATCH_SIZE === 0 || currentQ === totalInSection - 1;
    document.getElementById('nextBtn').style.display = isLastInBatch? 'none' : 'inline-block';
    document.getElementById('checkBatchBtn').style.display = isLastInBatch? 'inline-block' : 'none';
    document.getElementById('miniResult').style.display = 'none';
    document.getElementById('questionArea').style.display = 'block';
}

function saveAnswer(idx) {
    if(singleChecked) return; // منع التعديل بعد التحقق
    const q = allSections[currentSection][currentQ];
    if(q.answer.length > 1) {
        const arr = userAnswers[currentQ];
        const pos = arr.indexOf(idx);
        if (pos > -1) arr.splice(pos, 1); else arr.push(idx);
    } else {
        userAnswers[currentQ] = [idx];
    }
    document.querySelectorAll('#options label').forEach((label, i) => {
        if(userAnswers[currentQ].includes(i)) label.classList.add('selected');
        else label.classList.remove('selected');
    });
    document.getElementById('checkQBtn').disabled = userAnswers[currentQ].length === 0;
    saveProgress();
}

function checkSingleQuestion() {
    const q = allSections[currentSection][currentQ];
    const userAns = userAnswers[currentQ];
    const correctAns = q.answer;

    q.options.forEach((opt, i) => {
        const label = document.getElementById(`opt-${i}`);
        label.classList.remove('correct-answer', 'wrong-answer');

        if(correctAns.includes(i)) {
            label.classList.add('correct-answer');
        }
        if(userAns.includes(i) &&!correctAns.includes(i)) {
            label.classList.add('wrong-answer');
        }
    });

    document.getElementById('checkQBtn').disabled = true;
    document.querySelectorAll('#options input').forEach(input => input.disabled = true);
    singleChecked = true;

    const isCorrect = correctAns.sort().join(',') === userAns.sort().join(',');
    playSound(isCorrect? 'correct' : 'wrong');
}

function saveProgress() {
    const data = {
        answers: userAnswers,
        currentQ: currentQ,
        totalStartTime: totalStartTime
    };
    localStorage.setItem('quiz_'+currentSection, JSON.stringify(data));
}

function nextQ() {
    if (currentQ < allSections[currentSection].length - 1) {
        currentQ++;
        loadQ();
    }
}

function prevQ() {
    if (currentQ > 0) {
        currentQ--;
        loadQ();
    }
}
function checkBatch() {
    clearInterval(timerInterval);
    const totalInSection = allSections[currentSection].length;
    const batchEnd = Math.min(currentBatchStart + BATCH_SIZE, totalInSection);
    let batchScore = 0;
    let unanswered = 0;
    for(let i = currentBatchStart; i < batchEnd; i++) {
        const q = allSections[currentSection][i];
        if(userAnswers[i].length === 0) unanswered++;
        const correct = q.answer.sort().join(',');
        const user = (userAnswers[i] || []).sort().join(',');
        if (correct === user) {
            batchScore++;
            playSound('correct');
        } else if(userAnswers[i].length > 0) {
            playSound('wrong');
        }
    }
    if(unanswered > 0) {
        if(!confirm(`فيه ${unanswered} سؤال ما جاوبت عليه في هذي الدفعة. تبغى تتحقق الحين؟`)) {
            startBatchTimer();
            return;
        }
    }
    const batchTotal = batchEnd - currentBatchStart;
    const percent = ((batchScore/batchTotal)*100).toFixed(0);
    const elapsed = Math.floor((Date.now() - batchStartTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    document.getElementById('miniScore').innerText = `${batchScore} / ${batchTotal}`;
    document.getElementById('miniPercent').innerText = `النسبة: ${percent}%`;
    document.getElementById('miniTime').innerText = `الوقت: ${mins} دقيقة و ${secs} ثانية`;
    const isLastBatch = batchEnd === totalInSection;
    document.getElementById('continueBatchBtn').innerText = isLastBatch? 'شوف النتيجة النهائية' : 'كمل الدفعة الجاية';
    document.getElementById('continueBatchBtn').onclick = isLastBatch? submitQuiz : continueBatch;
    document.getElementById('questionArea').style.display = 'none';
    document.getElementById('miniResult').style.display = 'block';
}

function continueBatch() {
    currentBatchStart += BATCH_SIZE;
    currentQ = currentBatchStart;
    startBatchTimer();
    loadQ();
}

function submitQuiz() {
    clearInterval(timerInterval);
    if(mockTimer) clearInterval(mockTimer);
    let totalScore = 0;
    const totalQuestions = allSections[currentSection].length;
    let html = '<h3>مراجعة الأخطاء فقط:</h3>';
    let wrongCount = 0;
    wrongQuestions = [];
    allSections[currentSection].forEach((q, i) => {
        const correct = q.answer.sort().join(',');
        const user = (userAnswers[i] || []).sort().join(',');
        const isCorrect = correct === user;
        if (isCorrect) totalScore++;
        if(!isCorrect) {
            wrongCount++;
            const origQ = isMockMode? q : originalQuestions[i];
            wrongQuestions.push({q: origQ, userAnswer: userAnswers[i]});
            html += `<div class="review-item wrong">
                <strong>س${i+1}: ${q.q}</strong><br>
                إجابتك: ${userAnswers[i].map(x => String.fromCharCode(65+x) + '. ' + q.options[x]).join(' | ') || 'لم تجب'}<br>
                الصحيحة: ${q.answer.map(x => String.fromCharCode(65+x) + '. ' + q.options[x]).join(' | ')}
            </div>`;
        }
    });
    if(wrongCount === 0) {
        html += '<p style="color:var(--success); font-size:18px;">ممتاز! كل إجاباتك صحيحة 👏</p>';
    } else {
        document.getElementById('reviewWrongBtn').style.display = 'inline-block';
    }
    const totalElapsed = Math.floor((Date.now() - totalStartTime) / 1000);
    const totalMins = Math.floor(totalElapsed / 60);
    const totalSecs = totalElapsed % 60;
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('resultTitle').innerText = isMockMode? 'نتيجة الاختبار التجريبي' : `نتيجة القسم ${currentSection+1}`;
    document.getElementById('score').innerText = `${totalScore} / ${totalQuestions}`;
    document.getElementById('percent').innerText = `النسبة الكلية: ${((totalScore/totalQuestions)*100).toFixed(1)}%`;
    document.getElementById('totalTime').innerText = `الوقت الكلي: ${totalMins} دقيقة و ${totalSecs} ثانية`;
    document.getElementById('review').innerHTML = html;
    window.scrollTo({top: 0, behavior: 'smooth'});
    if(!isMockMode) updateStats(totalScore, totalQuestions);
    localStorage.removeItem('quiz_'+currentSection);
    isMockMode = false;
}
function startWrongOnly() {
    if(wrongQuestions.length === 0) return;
    isReviewMode = true;
    allSections[currentSection] = wrongQuestions.map(w => w.q);
    currentQ = 0;
    currentBatchStart = 0;
    userAnswers = Array(allSections[currentSection].length).fill(null).map(() => []);
    totalStartTime = Date.now();
    document.getElementById('result').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    startBatchTimer();
    loadQ();
}

function reviewAnswers() {
    let html = '<h3>مراجعة كل الإجابات:</h3>';
    allSections[currentSection].forEach((q, i) => {
        const correct = q.answer.sort().join(',');
        const user = (userAnswers[i] || []).sort().join(',');
        const isCorrect = correct === user;
        html += `<div class="review-item ${isCorrect? 'correct' : 'wrong'}">
            <strong>س${i+1}: ${q.q}</strong><br>
            إجابتك: ${userAnswers[i].map(x => String.fromCharCode(65+x) + '. ' + q.options[x]).join(' | ') || 'لم تجب'}<br>
            الصحيحة: ${q.answer.map(x => String.fromCharCode(65+x) + '. ' + q.options[x]).join(' | ')}
        </div>`;
    });
    document.getElementById('review').innerHTML = html;
}

function backToSectionsConfirm() {
    if(confirm('متأكد تبي ترجع؟ تقدمك الحالي محفوظ تلقائياً')) {
        backToSections();
    }
}

function backToSections() {
    clearInterval(timerInterval);
    if(mockTimer) clearInterval(mockTimer);
    // رجع الأسئلة الأصلية لو كنت في وضع المراجعة
    if(isReviewMode) {
        allSections[currentSection] = originalQuestions;
    }
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('sectionSelectArea').style.display = 'block';
    document.getElementById('backBtn').style.display = 'none';
    isReviewMode = false;
    isMockMode = false;
    // حدث قائمة الأقسام عشان يظهر عدد الأسئلة الجديد
    const sectionSelect = document.getElementById('sectionSelect');
    for(let i = 0; i < allSections.length; i++) {
        sectionSelect.options[i].text = `القسم ${i+1} - ${allSections[i].length} سؤال`;
    }
    checkSavedProgress();
}
</script>
</body>
</html>
